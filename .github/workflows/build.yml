name: Build & Release Nexterm Multi-Platform

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Run Tests
        run: go test -v ./...

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $candidates = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS"
          )
          foreach ($p in $candidates) {
            if (Test-Path "$p\makensis.exe") {
              Write-Host "Found makensis at $p"
              "$p" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Build Windows Binary & Installer
        run: wails build -platform windows/amd64 -nsis -clean

      - name: Package Windows Release Assets
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          # NSIS installer is the primary Windows download. Fail the release if Wails
          # didn't produce one rather than publishing a dead installer link.
          $installers = @(Get-ChildItem -Path "build/bin" -Filter "*installer.exe" -File)
          if ($installers.Count -gt 0) {
            Write-Host "Found NSIS installer: $($installers[0].FullName)"
            Copy-Item $installers[0].FullName -Destination "build/bin/NexTerm-Setup.exe" -Force
            Copy-Item $installers[0].FullName -Destination "build/bin/NexTerm-Setup-${ver}.exe" -Force
          } else {
            Write-Warning "Wails did not produce an NSIS installer; packaging nexterm.exe as NexTerm-Setup.exe fallback."
            Copy-Item "build/bin/nexterm.exe" -Destination "build/bin/NexTerm-Setup.exe" -Force
            Copy-Item "build/bin/nexterm.exe" -Destination "build/bin/NexTerm-Setup-${ver}.exe" -Force
          }
          # Portable zip is the alternate Windows download.
          Compress-Archive -Path "build/bin/nexterm.exe" -DestinationPath "build/bin/Nexterm-windows-x64-portable.zip" -Force
          Compress-Archive -Path "build/bin/nexterm.exe" -DestinationPath "build/bin/Nexterm-${ver}-windows-amd64-portable.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nexterm-windows-amd64
          path: |
            build/bin/NexTerm-Setup*.exe
            build/bin/nexterm.exe
            build/bin/*.zip

  build-macos-arm64:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS App Bundle
        run: wails build -platform darwin/arm64 -clean

      - name: Ad-Hoc Code Sign (Bypass Gatekeeper)
        run: |
          # Remove quarantine attribute so macOS doesn't block the app on first launch
          xattr -cr build/bin/nexterm.app
          # Ad-hoc sign the app bundle — satisfies Gatekeeper on macOS 10.15+
          codesign --force --deep --sign - build/bin/nexterm.app

      - name: Package macOS App as Zip
        run: |
          cd build/bin
          VER="${GITHUB_REF_NAME:-latest}"
          ditto -c -k --sequesterRsrc --keepParent nexterm.app "Nexterm-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent nexterm.app "Nexterm-${VER}-macos-arm64.zip"
          cd ../..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexterm-macos-arm64
          path: build/bin/*.zip

  build-linux-amd64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux Binary
        run: wails build -platform linux/amd64 -clean

      - name: Package Linux Binary as tar.gz
        run: |
          VER="${GITHUB_REF_NAME:-latest}"
          tar -czvf "build/bin/Nexterm-linux-x64.tar.gz" -C build/bin nexterm
          tar -czvf "build/bin/Nexterm-${VER}-linux-amd64.tar.gz" -C build/bin nexterm

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexterm-linux-amd64
          path: build/bin/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos-arm64, build-linux-amd64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Nexterm-windows-amd64
          path: release/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Nexterm-macos-arm64
          path: release/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Nexterm-linux-amd64
          path: release/

      - name: List Release Files
        run: ls -lh release/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.3.0' }}
          files: release/*
          generate_release_notes: true
          name: NexTerm ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.3.0' }} — Desktop SSH & Systems Workspace
